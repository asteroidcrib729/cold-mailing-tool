name: Security checks
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - run: python scripts/install_tools.py
      - run: python scripts/scan_snapshot.py
      # Scan the full reachable history; keep this gate active after remediation.
      - run: reports/tools/gitleaks git --redact --log-opts="--all" .
      - run: reports/tools/actionlint
  dependencies:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.9'
      - run: uv sync --locked --all-groups
      - run: uv run --locked --group security bandit -c pyproject.toml -r .
      - run: New-Item -ItemType Directory -Force reports
      - run: uv export --quiet --locked --no-default-groups --no-emit-project --format requirements-txt --output-file reports/runtime-requirements.txt
      - run: uv run --locked --group security pip-audit -r reports/runtime-requirements.txt --require-hashes --disable-pip
