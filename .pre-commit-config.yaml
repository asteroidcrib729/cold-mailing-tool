repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv --cache-dir .uv-cache run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff formatting
        entry: uv --cache-dir .uv-cache run --locked ruff format --check
        language: system
        types: [python]
      - id: repository-boundaries
        name: Architecture and documentation boundaries
        entry: uv --cache-dir .uv-cache run --locked python scripts/check_repository.py
        language: system
        pass_filenames: false
      - id: staged-secrets
        name: Staged source secret scan
        entry: uv --cache-dir .uv-cache run --locked python scripts/scan_snapshot.py --staged
        language: system
        pass_filenames: false
